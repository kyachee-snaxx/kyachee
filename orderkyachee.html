<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/jpeg" href="https://i.ibb.co/vC8zXkYv/8bdef540-3dd4-4e14-a286-50fda186c916.jpg">

<title>Order Now | Kyachee Snaxx Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root{
    --primary-gradient: linear-gradient(135deg, #ffcc00 0%, #ff5252 100%);
    --premium-gold: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #d4ac0d 100%);
    --gold-hover: linear-gradient(135deg, #ffd433 0%, #f39c12 100%);
    --secondary-light-red: #ff7675;
    --dark-color: #0f0f11;
    --white: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.25);
    --luxury-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.04);
}

body{
    font-family: 'Outfit', 'Poppins', sans-serif;
    margin:0;
    background: linear-gradient(180deg, #fffbf0 0%, #fff3f3 50%, #fffcf5 100%);
    color: var(--dark-color);
    position:relative;
    min-height: 100vh;
}

/* Soft background glow effects */
body::before {
    content: '';
    position: absolute;
    top: 20%;
    right: -5%;
    width: 350px;
    height: 350px;
    background: #ff5252;
    filter: blur(130px);
    opacity: 0.1;
    z-index: -1;
    border-radius: 50%;
}

/* --- GLASSMORPHISM HEADER --- */
header{
    background: linear-gradient(135deg, rgba(255, 204, 0, 0.2), rgba(255, 82, 82, 0.15));
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--glass-border);
    padding: 50px 20px;
    text-align:center;
    position: relative;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
}

header h1{
    font-size: 3.8rem;
    margin:0;
    text-transform:uppercase;
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(135deg, #222 30%, #ff5252 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

header h2 {
    margin: -10px 0 15px 0;
    color: var(--secondary-light-red);
    font-size: 1.8rem;
    text-transform: lowercase;
    font-weight: 400;
    letter-spacing: 2px;
}

header p {
    font-weight: 500;
    font-size: 1.1rem;
    color: #444;
    margin: 0;
}

.back-btn{
    position:absolute;
    top: 30px;
    left:20px;
    background: var(--dark-color);
    color: #ffcc00;
    border:none;
    padding: 10px 22px;
    border-radius:50px;
    font-size:0.85rem;
    font-weight:700;
    cursor:pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.back-btn:hover{
    background: var(--secondary-light-red);
    color: white;
    transform: translateX(-3px);
}

.back-btn:active{
    transform:scale(0.95);
}

/* Floating Premium Order Container */
.order-container{
    max-width:480px;
    margin: 50px auto;
    background: white;
    padding: 40px;
    border-radius: 24px;
    box-shadow: var(--luxury-shadow);
    border: 1px solid rgba(0, 0, 0, 0.02);
    box-sizing: border-box;
}

.order-container h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #111;
}

/* --- IMAGE SIZE INCREASED FOR DESKTOP --- */
.snack-icon{
    height: 9.5rem; 
    width:auto;
    object-fit: contain;
}

label{
    font-size:0.85rem;
    font-weight:700;
    display:block;
    margin-bottom: 8px;
    color:#444;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

input,
textarea{
    width:100%;
    padding: 14px 18px;
    margin-bottom: 24px;
    border: 1.5px solid #eee;
    border-radius: 14px;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    background: #fafafa;
}

/* Soft light-red accents on focus */
input:focus,
textarea:focus{
    outline: none;
    border-color: var(--secondary-light-red);
    background: #fff;
    box-shadow: 0 0 10px rgba(255, 118, 117, 0.1);
}

.readonly-box{
    background: #f7f7f9;
    color: #555;
    font-weight: 600;
    cursor: not-allowed;
    border-color: #f1f1f1;
}

/* Premium Golden Button */
button.submit-btn{
    background: var(--premium-gold);
    color: #4a3300;
    padding: 18px;
    border:none;
    width:100%;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 6px 20px rgba(212, 172, 13, 0.25);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    margin-top: 10px;
}

button.submit-btn:hover{
    background: var(--dark-color);
    color: #ffcc00;
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(15, 15, 17, 0.25);
}

button.submit-btn:disabled {
    background: #ccc;
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

footer{
    text-align:center;
    padding:40px 20px;
    background: var(--dark-color);
    color:#777;
    font-size:0.85rem;
    margin-top: 80px;
    border-top: 1px solid rgba(255,255,255,0.02);
}

/* Responsive optimization */
@media (max-width: 768px) {
    header { padding: 40px 16px; }
    header h1 { font-size: 3rem; }
    .back-btn { position: static; display: inline-block; margin: 15px 0 0 20px; padding: 8px 18px; }
    .order-container { width: 92%; margin: 30px auto; padding: 25px; border-radius: 20px; }
}

@media (max-width: 480px) {
    header h1 { font-size: 2.5rem; }
    .order-container { padding: 20px; }
    .snack-icon { height: 5.5rem; } /* Mobile responsive height adjustment */
    input, textarea { padding: 12px 14px; margin-bottom: 18px; font-size: 0.9rem; }
    button.submit-btn { font-size: 1rem; padding: 15px; }
}

</style>
</head>

<body>

<header>

<button onclick="history.back()" class="back-btn">
← Back
</button>

<h1>Kyachee</h1>
<h2>snaxx</h2>

<p>"Fun to say, better to eat"</p>

</header>

<div class="order-container">

<h2>
<img src="https://i.ibb.co/7JZ7QSHb/b01492d9-eadd-4772-a7ee-32fd867b9a66-removebg-preview.png" class="snack-icon">
Secure Checkout
</h2>

<form id="orderForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Your Name" required>

<label>WhatsApp Number</label>
<input type="text" id="phone" placeholder="Contact Number" required>

<label>Delivery Address</label>
<textarea id="address" rows="3" placeholder="Flat No, Street, Landmark, Pin" required></textarea>

<label>Items in Your Cart</label>
<textarea id="productList" rows="3" class="readonly-box" readonly></textarea>

<label>Total Amount (₹)</label>
<input type="text" id="totalDisplay" class="readonly-box" readonly>

<button type="submit" class="submit-btn">
Confirm Your Order
</button>

</form>

</div>

<script>

window.onload = function(){

    let summary = localStorage.getItem("fullOrderSummary");
    let total = localStorage.getItem("totalOrderAmount");

    if(summary){

        document.getElementById("productList").value = summary;
        document.getElementById("totalDisplay").value = total;

    }else{

        alert("Please add items to cart first!");
        window.location.href = "cart.html";

    }

};

document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    const btn = document.querySelector(".submit-btn");

    btn.innerHTML = "Opening WhatsApp...";
    btn.disabled = true;

    // CUSTOMER DETAILS
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let products = document.getElementById("productList").value;
    let total = document.getElementById("totalDisplay").value;

    // YOUR WHATSAPP NUMBER
    let ownerNumber = "919495603617";

    // MESSAGE
    let message =
`🛒 *NEW ORDER - KYACHEE SNAXX*

👤 Name: ${name}

📞 Phone: ${phone}

🏠 Address:
${address}

🧾 Ordered Items:
${products}

💰 Total Amount: ₹${total}`;

    // ENCODE MESSAGE
    let encodedMessage = encodeURIComponent(message);

    // WHATSAPP LINK
    let whatsappURL =
`https://wa.me/${ownerNumber}?text=${encodedMessage}`;

    // CLEAR CART
    localStorage.removeItem("cart");
    localStorage.removeItem("fullOrderSummary");
    localStorage.removeItem("totalOrderAmount");

    // OPEN WHATSAPP
    window.location.href = whatsappURL;

});

</script>

<footer>
&copy; 2026 Kyachee Snaxx. Premium Quality Kerala Snacks.
</footer>

</body>
</html>
