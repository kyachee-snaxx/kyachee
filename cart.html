<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Kyachee Snaxx</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

<!-- Modern Google Fonts (Poppins + Outfit) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root { 
    --primary-gradient: linear-gradient(135deg, #ffcc00 0%, #ff5252 100%);
    --premium-gold: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #d4ac0d 100%);
    --gold-hover: linear-gradient(135deg, #ffd433 0%, #f39c12 100%);
    --secondary-light-red: #ff7675;
    --dark-color: #0f0f11;
    --white: #ffffff;
    --glass-border: rgba(255, 255, 255, 0.25);
    --luxury-shadow: 0 15px 35px rgba(0, 0, 0, 0.06), 0 5px 15px rgba(0, 0, 0, 0.04);
}

body { 
    font-family: 'Outfit', 'Poppins', sans-serif; 
    margin:0; 
    background: linear-gradient(180deg, #fffbf0 0%, #fff3f3 50%, #fffcf5 100%);
    color: var(--dark-color);
    min-height: 100vh;
    position: relative;
}

/* Soft background glow effects */
body::before {
    content: '';
    position: absolute;
    top: 10%;
    left: -5%;
    width: 300px;
    height: 300px;
    background: #ffcc00;
    filter: blur(120px);
    opacity: 0.12;
    z-index: -1;
    border-radius: 50%;
}

/* --- GLASSMORPHISM HEADER --- */
header { 
    background: linear-gradient(135deg, rgba(255, 204, 0, 0.2), rgba(255, 82, 82, 0.15));
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--glass-border);
    padding: 30px; 
    text-align: center; 
    font-size: 24px; 
    font-weight: 800; 
    letter-spacing: 0.5px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.02);
}

.back-btn {
    position: absolute;
    top: 32px;
    left: 20px;
    background: var(--dark-color);
    color: #ffcc00;
    border: none;
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.back-btn:hover { 
    background: var(--secondary-light-red); 
    color: white; 
    transform: translateX(-3px);
}
.back-btn:active { transform: scale(0.95); }

h2 { 
    text-align: center; 
    margin-top: 50px; 
    font-size: 2rem;
    font-weight: 700;
    color: #111; 
}

/* Floating Premium Table Container */
.table-container { 
    width:92%; 
    max-width:950px; 
    margin:30px auto; 
    background:#fff; 
    border-radius: 20px; 
    box-shadow: var(--luxury-shadow); 
    overflow-x:auto; 
    border: 1px solid rgba(0, 0, 0, 0.02);
}

table { width:100%; border-collapse:collapse; min-width: 500px; }
th, td { padding: 18px 20px; text-align:center; border-bottom:1px solid #f8f8f8; }
th { background: #fafafa; font-weight: 700; color: #555; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }

.product-cell { display: flex; align-items: center; gap: 16px; text-align: left; }
.cart-img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
.product-cell span { font-weight: 600; color: #222; }

/* Premium Soft Quantity Controls */
.qty-controls-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf6f6;
    padding: 6px 12px;
    border-radius: 50px;
    width: fit-content;
    margin: 0 auto;
    border: 1px solid rgba(255, 118, 117, 0.08);
}

.qty-btn { 
    background: var(--white); 
    border: none; 
    width: 28px; 
    height: 28px; 
    cursor: pointer; 
    border-radius: 50%; 
    font-weight: bold; 
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    transition: all 0.2s ease;
}
.qty-btn:hover { background: var(--secondary-light-red); color: white; }
.qty-val { margin: 0 12px; font-weight: 700; font-size: 1rem; color: #111; }

.remove-btn { 
    background: #fff0f0; 
    color: #ff4d4d; 
    border: none; 
    padding: 8px 14px; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 600;
    transition: all 0.2s ease;
}
.remove-btn:hover { background: #ff4d4d; color: #fff; }

.total-section { 
    text-align: center; 
    font-size: 28px; 
    margin: 40px 20px 20px 20px; 
    font-weight: 800; 
    color: var(--dark-color); 
}

/* Premium Golden Button (Rounded) */
.btn { 
    display: block; 
    margin: 20px auto 60px; 
    padding: 18px 60px; 
    background: var(--premium-gold); 
    color: #4a3300;
    border: none; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 800; 
    font-size: 1.2rem; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 25px rgba(212, 172, 13, 0.3);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
}
.btn:hover { 
    background: var(--dark-color); 
    color: #ffcc00;
    transform: translateY(-4px); 
    box-shadow: 0 12px 30px rgba(15, 15, 17, 0.25);
}

/* Responsive spacing optimizations */
@media (max-width: 768px) {
    header { padding: 25px; font-size: 22px; }
    .back-btn { position: static; display: inline-block; margin: 20px 0 0 20px; padding: 8px 18px; }
    h2 { margin-top: 25px; font-size: 1.6rem; }
}

@media (max-width: 600px) { 
    header { font-size: 20px; padding: 20px; } 
    .table-container { width: 95%; margin: 15px auto; border-radius: 14px; }
    th, td { padding: 12px 10px; font-size: 0.9rem; }
    .cart-img { width: 42px; height: 42px; border-radius: 8px; }
    .product-cell { gap: 10px; }
    .qty-controls-wrapper { padding: 4px 8px; }
    .qty-btn { width: 24px; height: 24px; font-size: 0.8rem; }
    .qty-val { margin: 0 8px; font-size: 0.9rem; }
    .remove-btn { padding: 6px 10px; font-size: 0.8rem; }
    .total-section { font-size: 22px; margin-top: 30px; }
    .btn { width: 90%; padding: 15px 20px; font-size: 1.05rem; }
}
</style>
</head>
<body>

<header>
    <button onclick="goBack()" class="back-btn">⬅ Back</button>
    Kyachee Snaxx Cart 🛒
</header>

<h2>Your Items</h2>

<div class="table-container">
<table id="cartTable">
<thead>
    <tr>
    <th style="text-align: left; padding-left: 25px;">Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Remove</th>
    </tr>
</thead>
<tbody id="cartBody"></tbody>
</table>
</div>

<div class="total-section" id="grandTotal">Total: ₹0</div>
<button class="btn" onclick="goToOrder()">Place Order Now</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){
    let tableBody = document.getElementById("cartBody");
    tableBody.innerHTML = "";
    let total = 0;

    if(cart.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='4' style='padding:40px; color:#aa9696; font-weight:500;'>Your cart is empty!</td></tr>";
        document.getElementById("grandTotal").innerText = "Total: ₹0";
        return;
    }

    cart.forEach((item, index) => {
        let row = tableBody.insertRow();
        row.innerHTML = `
        <td>
            <div class="product-cell" style="padding-left: 10px;">
                <img src="${item.img}" class="cart-img">
                <span>${item.name}</span>
            </div>
        </td>
        <td style="font-weight: 600;">₹${item.price}</td>
        <td>
            <div class="qty-controls-wrapper">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-val">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
        </td>
        <td>
            <button class="remove-btn" onclick="removeItem(${index})">✕</button>
        </td>
        `;
        total += item.price * item.qty;
    });

    document.getElementById("grandTotal").innerText = "Total: ₹" + total;
}

function updateQty(index, change) {
    if (cart[index].qty + change > 0) {
        cart[index].qty += change;
        saveAndReload();
    }
}

function removeItem(index){
    if(confirm("Remove this item?")) {
        cart.splice(index, 1);
        saveAndReload();
    }
}

function saveAndReload() {
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function goToOrder(){
    if(cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    let summary = cart.map(item => `${item.name} (${item.qty}kg)`).join(", ");
    let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

    localStorage.setItem("fullOrderSummary", summary);
    localStorage.setItem("totalOrderAmount", totalAmount);
    window.location.href = "orderkyachee.html";
}

function goBack(){
    window.history.back();
}

loadCart();
</script>
</body>
</html>
